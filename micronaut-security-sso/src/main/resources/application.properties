micronaut.application.name=micronaut-sso-app-a
micronaut.server.host=127.0.0.1
micronaut.server.port=9201
micronaut.security.authentication=session
micronaut.security.redirect.login-success=/
micronaut.security.redirect.login-failure=/?loginError=true
micronaut.security.redirect.logout=/
micronaut.security.endpoints.logout.get-allowed=false
micronaut.security.oauth2.clients.keycloak.client-id=micronaut-app-a
micronaut.security.oauth2.clients.keycloak.client-secret=${MICRONAUT_SSO_CLIENT_A_SECRET}
micronaut.security.oauth2.clients.keycloak.openid.issuer=http://localhost:9200/realms/micronaut-sso
micronaut.security.oauth2.clients.keycloak.openid.authorization.code-challenge-method=S256
micronaut.security.oauth2.clients.keycloak.openid.end-session.enabled=false
micronaut.security.oauth2.state.cookie.cookie-name=MN_SSO_A_STATE
micronaut.security.oauth2.openid.nonce.cookie.cookie-name=MN_SSO_A_NONCE
micronaut.security.csrf.enabled=true
micronaut.security.csrf.repositories.session.enabled=true
micronaut.security.csrf.repositories.cookie.enabled=false
micronaut.session.http.cookie-name=MN_SSO_APP_A_SESSION
micronaut.session.http.cookie-http-only=true
micronaut.session.http.cookie-same-site=Lax
micronaut.session.http.header=false
micronaut.session.max-inactive-interval=30m
