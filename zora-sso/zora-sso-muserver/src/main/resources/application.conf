zora-sso {
  environment = "development"

  local-auth {
    enabled = true
    production-allowed = false
  }

  server {
    host = "127.0.0.1"
    port = 9080
    public-base-url = "http://localhost:9080"
  }

  cookie {
    name = "ZORA_SSO_SESSION"
    secure = false
  }

  # Add only PBKDF2 hashes generated by PasswordHashCli. Never put plaintext secrets here.
  users = [
    {
      subject = "user-1"
      username = "alice"
      display-name = "Alice"
      password-hash = "pbkdf2-sha256$210000$bG9jYWx1c2VyLXNhbHQtMQ$KR52AlwHQ7ZPhIINWshFFi-SshytbIyE1mVnTWmqMh4"
      roles = ["USER"]
      enabled = true
    },
    {
      subject = "user-2"
      username = "bob"
      display-name = "Bob"
      password-hash = "pbkdf2-sha256$210000$bG9jYWx1c2VyLXNhbHQtMg$fUM3SVyeWjDXssxlvHjIi0jBE4ncNfVU5gOtTcpHndQ"
      roles = ["USER"]
      enabled = true
    },
    {
      subject = "admin-1"
      username = "admin"
      display-name = "Administrator"
      password-hash = "pbkdf2-sha256$210000$bG9jYWx1c2VyLXNhbHQtMw$6iGivxgpNlES65kFp32P3awNv5-eY0EVL67Oqbn-Lg8"
      roles = ["ADMIN", "USER"]
      enabled = true
    }
  ]
  clients = [
    {
      client-id = "app-a"
      client-secret-hash = "pbkdf2-sha256$210000$Y2xpZW50LXNhbHQtYQ$T1OWD9Qc8zW-2znxHlVgQ6eXZ2ch1JBWN2uIPb-Z1Q4"
      redirect-uris = ["http://localhost:8081/callback"]
      enabled = true
    },
    {
      client-id = "app-b"
      client-secret-hash = "pbkdf2-sha256$210000$Y2xpZW50LXNhbHQtYg$TA5jiB5UFvGLvprhRR4xTxUISH_0FJie5MFzaUCGA1I"
      redirect-uris = ["http://localhost:8082/callback", "http://localhost:8082/authorized"]
      enabled = true
    },
    {
      client-id = "app-c"
      client-secret-hash = "pbkdf2-sha256$210000$Y2xpZW50LXNhbHQtYw$cqrtExJTkkbQvNFUj6RjtysiEawZG0bwgbbn2sJHz8c"
      redirect-uris = ["http://localhost:8083/callback"]
      enabled = true
    }
  ]
}
