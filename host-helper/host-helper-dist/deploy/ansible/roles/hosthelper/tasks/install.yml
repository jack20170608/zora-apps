- name: Create application root
  ansible.builtin.file:
    path: "{{ host_helper_root }}"
    state: directory
    owner: "{{ host_helper_user }}"
    group: "{{ host_helper_group }}"
    mode: '0750'

- name: Select environment for zora-bin
  ansible.builtin.copy:
    content: "{{ host_helper_env }}\n"
    dest: "{{ host_helper_root }}/env.tag"
    owner: "{{ host_helper_user }}"
    group: "{{ host_helper_group }}"
    mode: '0640'

- name: Extract version directory into application root
  ansible.builtin.unarchive:
    src: "{{ service_archive }}"
    dest: "{{ host_helper_root }}"
    owner: "{{ host_helper_user }}"
    group: "{{ host_helper_group }}"
    creates: "{{ host_helper_root }}/{{ host_helper_version }}/app.jar"

- name: Check packaged application, zora-bin scripts and config
  ansible.builtin.stat:
    path: "{{ host_helper_root }}/{{ host_helper_version }}/{{ item }}"
  loop:
    - app.jar
    - lib
    - bin/deploy.sh
    - bin/lifecycle.sh
    - bin/start.sh
    - bin/status.sh
    - bin/stop.sh
    - config/application.conf
    - config/setenv
  register: host_helper_release_artifacts

- name: Refuse an incomplete release
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "Incomplete release: {{ item.item }}"
  loop: "{{ host_helper_release_artifacts.results }}"

