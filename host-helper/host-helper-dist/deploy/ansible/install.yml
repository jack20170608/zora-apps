---
- name: Deploy host-helper with zora-bin lifecycle
  hosts: host_helper
  become: true
  vars:
    host_helper_root: /opt/hosthelper
  tasks:
    - name: Require a version and a local service archive
      ansible.builtin.assert:
        that:
          - host_helper_version is defined
          - host_helper_version is match('^[a-zA-Z0-9][a-zA-Z0-9._-]*$')
          - "'..' not in host_helper_version"
          - service_archive is defined
          - service_archive | length > 0
          - "service_archive | basename == 'host-helper-dist-' ~ host_helper_version ~ '-service.tar.gz'"
          - host_helper_env is defined
          - host_helper_env is match('^[a-zA-Z0-9_-]+$')
        fail_msg: "Pass -e host_helper_version=... -e service_archive=/path/to/host-helper-dist-VERSION-service.tar.gz -e host_helper_env=..."

    - name: Check service archive on controller
      ansible.builtin.stat:
        path: "{{ service_archive }}"
      delegate_to: localhost
      become: false
      register: host_helper_archive

    - name: Reject missing or non-file service archive
      ansible.builtin.assert:
        that:
          - host_helper_archive.stat.exists
          - host_helper_archive.stat.isreg
        fail_msg: "Missing local service archive: {{ service_archive }}"

    - name: Check externally provisioned zora-bin setenv
      ansible.builtin.stat:
        path: /etc/host-helper/release-config/setenv
      register: host_helper_environment

    - name: Require external release environment
      ansible.builtin.assert:
        that:
          - host_helper_environment.stat.exists
          - host_helper_environment.stat.isreg
        fail_msg: "Provision /etc/host-helper/release-config/setenv with HOST_HELPER_CONFIG_DIR and PORT before deploying"

    - name: Check externally provisioned application configuration
      ansible.builtin.stat:
        path: "/etc/host-helper/config/application-{{ host_helper_env }}.conf"
      register: host_helper_config

    - name: Refuse to deploy without the selected configuration
      ansible.builtin.assert:
        that:
          - host_helper_config.stat.exists
          - host_helper_config.stat.isreg
        fail_msg: "Provision /etc/host-helper/config/application-{{ host_helper_env }}.conf before deploying"

    - name: Create service group
      ansible.builtin.group:
        name: hosthelper
        system: true

    - name: Create service account
      ansible.builtin.user:
        name: hosthelper
        group: hosthelper
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    - name: Create release directory
      ansible.builtin.file:
        path: "{{ host_helper_root }}"
        state: directory
        owner: hosthelper
        group: hosthelper
        mode: '0750'

    - name: Select application environment for zora-bin
      ansible.builtin.copy:
        content: "{{ host_helper_env }}\n"
        dest: "{{ host_helper_root }}/env.tag"
        owner: hosthelper
        group: hosthelper
        mode: '0640'

    - name: Extract service archive
      ansible.builtin.unarchive:
        src: "{{ service_archive }}"
        dest: /opt
        owner: hosthelper
        group: hosthelper
        creates: "{{ host_helper_root }}/{{ host_helper_version }}/app.jar"

    - name: Check required release artifacts
      ansible.builtin.stat:
        path: "{{ host_helper_root }}/{{ host_helper_version }}/{{ item }}"
      loop:
        - app.jar
        - bin/deploy.sh
        - bin/start.sh
        - bin/lifecycle.sh
        - lib
      register: release_artifacts

    - name: Refuse incomplete service archives
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Incomplete release: {{ item.item }}"
      loop: "{{ release_artifacts.results }}"

    - name: Create version configuration directory
      ansible.builtin.file:
        path: "{{ host_helper_root }}/{{ host_helper_version }}/config"
        state: directory
        owner: hosthelper
        group: hosthelper
        mode: '0750'

    - name: Provision trusted version configuration from target machine
      ansible.builtin.copy:
        src: /etc/host-helper/release-config/
        dest: "{{ host_helper_root }}/{{ host_helper_version }}/config/"
        remote_src: true
        owner: hosthelper
        group: hosthelper
        mode: preserve
      no_log: true

    - name: Check active release
      ansible.builtin.stat:
        path: "{{ host_helper_root }}/active"
        follow: false
      register: active_release

    - name: Activate the packaged release via zora-bin
      ansible.builtin.command:
        argv:
          - /usr/bin/bash
          - "{{ host_helper_root }}/{{ host_helper_version }}/bin/deploy.sh"
          - --activate
          - "{{ host_helper_version }}"
      become_user: hosthelper
      when: active_release.stat.lnk_target | default('') != host_helper_version

    - name: Check whether application is already running
      ansible.builtin.command:
        argv:
          - /usr/bin/bash
          - "{{ host_helper_root }}/active/bin/status.sh"
      become_user: hosthelper
      changed_when: false
      failed_when: false
      register: application_status

    - name: Start application after first deployment
      ansible.builtin.command:
        argv:
          - /usr/bin/bash
          - "{{ host_helper_root }}/active/bin/start.sh"
      become_user: hosthelper
      when: application_status.rc != 0

