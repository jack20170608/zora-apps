name = "hosthelper"

server = {
  port = 8000
  port = ${?PORT}
  contextPath = "hosthelper"
}

# all host helper instances with given env classification
cookie.domain = [
  "localhost"
  "jack007.top"
]

## the cookie name
cookie = {
  name = "hosthelperjwt"
  valueType = "JWT"
}

# security settings
security = {
  whiteList = [
    "^/openapi.json",
    "^/api.html",
  ]
}

# jwt settings
jwt = {
  publicKeyLocation = "file:NOT-SET"
  privateKeyLocation = "file:NOT-SET"
  ttl = "1h"
}

# zora-sso client settings. Override deployment-specific values outside the service archive.
sso = {
  base-uri = "http://localhost:9080"
  client-id = "host-helper"
  client-secret = "1"
  redirect-uri = "http://localhost:8001/auth/sso/callback"
  login-path = "/auth/sso/login"
  callback-path = "/auth/sso/callback"
  request-timeout = "5s"
  state-ttl = "5m"
  max-pending-states = 10000
  max-response-bytes = 65536
  secure-cookie = false
  secure-cookie = ${?HOST_HELPER_SECURE_COOKIE}
  role-mappings = {
    USER = ["read"]
    ADMIN = ["admin", "read", "write"]
  }
}

## The config user list
users = []


hosts = {
  local80 = {
    env = "local"
    url = "http://localhost:8000"
  },
  local81 = {
    env = "local"
    url = "http://localhost:8001"
  },
  sit-10 = {
    env = "sit"
    url = "https://10.10.10.5:8000"
  },
  sit-11 = {
    env = "sit"
    url = "https://10.10.10.6:8000"
  },
  sit-12 = {
    env = "sit"
    url = "https://10.10.10.12:8000"
  },
  uat-20 = {
    env = "uat"
    url = "https://10.10.10.20:8000"
  },
  uat-21 = {
    env = "uat"
    url = "https://10.10.10.21:8000"
  },
  prod-30 = {
    env = "prod"
    url = "https://10.10.10.30:8000"
  },
  prod-31 = {
    env = "prod"
    url = "https://10.10.10.31:8000"
  },
  prod-32 = {
    env = "prod"
    url = "https://10.10.10.32:8000"
  },
  prod-33 = {
    env = "prod"
    url = "https://10.10.10.33:8000"
  }
}


# customize the output
query = {
  dateFormat = "yyyy-MM-dd"
  timestampFormat = "yyyy-MM-dd HH:mm:ss.SSS"
  timeFormat = "HH:mm:ss.SSS"
}
