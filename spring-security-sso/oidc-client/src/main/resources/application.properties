spring.profiles.default=app-a
server.address=127.0.0.1
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.error.include-message=never
spring.security.oauth2.client.provider.lab.issuer-uri=http://localhost:9100
spring.security.oauth2.client.registration.lab.provider=lab
spring.security.oauth2.client.registration.lab.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.lab.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.lab.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.lab.scope=openid,profile
